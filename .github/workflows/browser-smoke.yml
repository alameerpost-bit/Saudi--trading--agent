name: Browser smoke tests

on:
  push:
    branches:
      - feature/saudi-skills-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Install locked backend dependencies
        run: npm ci
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests with mocked provider responses
        run: node --test tests/browser-smoke.test.js
